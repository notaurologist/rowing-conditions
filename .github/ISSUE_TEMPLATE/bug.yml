name: Bug
description: Something behaves differently from the docs or from reality.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the location, gauge, and time if conditions were involved.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
      description: And which doc or source says so.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
