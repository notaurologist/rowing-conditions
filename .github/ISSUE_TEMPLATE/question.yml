name: Open question
description: A product or design question that needs an answer before or during a milestone.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: The question and why it matters.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant docs, sources, and options considered.
  - type: input
    id: needed-by
    attributes:
      label: Needed by
      description: The milestone or issue that depends on the answer.
